<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EnCuba Pulso — Noticias de Cuba resumidas al momento</title>
  <meta name="description" content="EnCuba Pulso resume y agrupa las noticias más importantes de Cuba. Lee o escucha en audio las últimas noticias de energía, economía, salud y más. Oficial, alternativa e internacional en un solo lugar.">
  <meta name="keywords" content="noticias de Cuba, Cuba noticias hoy, noticias cuba, apagones cuba, economía cuba, mipymes cuba, cuba actualidad, resumen noticias cuba">
  <meta name="author" content="EnCuba Pulso">
  <meta name="robots" content="index, follow">

  <!-- Open Graph (Facebook, WhatsApp) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="EnCuba Pulso — Noticias de Cuba resumidas al momento">
  <meta property="og:description" content="Lee o escucha en audio las noticias más importantes de Cuba, resumidas y agrupadas por tema.">
  <meta property="og:url" content="https://encubanoticias.github.io">
  <meta property="og:site_name" content="EnCuba Pulso">
  <meta property="og:locale" content="es_CU">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="EnCuba Pulso — Noticias de Cuba resumidas">
  <meta name="twitter:description" content="Resumen y audio de las noticias más importantes de Cuba.">

  <link rel="canonical" href="https://encubanoticias.github.io">
  <link rel="stylesheet" href="css/estilo.css">

  <!-- Datos estructurados para Google -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "NewsMediaOrganization",
    "name": "EnCuba Pulso",
    "url": "https://encubanoticias.github.io",
    "description": "Agregador de noticias de Cuba con resúmenes y audio.",
    "inLanguage": "es-CU"
  }
  </script>
</head>
<body>

<header>
  <div class="header-top">
    <h1><span>En</span>Cuba Pulso</h1>
    <div class="header-actions">
      <input type="search" id="buscador" placeholder="Buscar...">
      <button id="btn-tema" aria-label="Cambiar tema">🌙</button>
    </div>
  </div>
  <nav class="filtros">
    <button class="chip activo" data-filtro="todas">Todas</button>
    <button class="chip" data-filtro="oficial">Oficial</button>
    <button class="chip" data-filtro="alternativa">Alternativa</button>
    <button class="chip" data-filtro="internacional">Internacional</button>
  </nav>
</header>

<main>

  <section id="carrusel" class="carrusel"></section>

  <section class="seccion">
    <h2 class="seccion-titulo">🔍 Perspectivas <span class="info-icon" onclick="mostrarInfo()">ⓘ</span></h2>
    <div id="perspectivas" class="perspectivas"></div>
  </section>
  
  <section class="seccion">
    <h2 class="seccion-titulo">🔥 Noticias calientes</h2>
    <div id="calientes" class="calientes"></div>
  </section>

  <section class="seccion">
    <h2 class="seccion-titulo">📰 Todas las noticias</h2>
    <div id="noticias" class="grid"></div>
  </section>

  <section class="seccion">
    <h2 class="seccion-titulo">🎧 Modo Podcast</h2>
    <div id="podcast" class="podcast"></div>
  </section>

</main>

<div id="reproductor" class="reproductor oculto">
  <span id="rep-titulo">Sin reproducción</span>
  <button id="rep-play">▶</button>
  <button id="rep-cerrar">✕</button>
</div>

<script src="js/app.js"></script>
</body>
</html>
